<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" style="background:#fafafa; font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#555"/></marker>
    <style>
      text { fill:#222; }
      .title { font-size:28px; font-weight:700; fill:#111; }
      .subtitle { font-size:18px; font-weight:400; fill:#444; }
      .label { font-size:14px; font-weight:600; fill:#111; }
      .pin-label { font-size:13px; font-weight:600; }
      .note { font-size:13px; fill:#333; }
      .small { font-size:12px; fill:#444; }
      .gnd { fill:#424242; stroke:#424242; stroke-width:2; }
      .v5 { fill:#e53935; stroke:#e53935; stroke-width:2; }
      .v33 { fill:#fb8c00; stroke:#fb8c00; stroke-width:2; }
      .sig { fill:#1e88e5; stroke:#1e88e5; stroke-width:2; }
      .box { fill:#fff; stroke:#aaa; stroke-width:1.5; rx:6; }
      .box-fill { fill:#f5f7fa; stroke:#bbb; stroke-width:1.5; rx:6; }
      .wire-label { font-size:12px; font-weight:600; fill:#111; background:#fff; padding:2px 4px; }
    </style>
  </defs>

  <!-- Title -->
  <text x="960" y="48" text-anchor="middle" class="title">WATCHPOD v1.2</text>
  <text x="960" y="78" text-anchor="middle" class="subtitle">Smart Home Energy &amp; Security Assistant — ESP32 Hardware Wiring &amp; Circuit Diagram</text>

  <!-- ============================================================ -->
  <!-- BREADBOARD OUTLINE -->
  <!-- ============================================================ -->
  <rect x="60" y="100" width="1200" height="520" rx="12" fill="#f0f2f4" stroke="#ccc" stroke-width="1.5"/>
  <rect x="70" y="110" width="1180" height="500" rx="8" fill="#e8ebed" stroke="#bbb" stroke-width="1"/>

  <!-- Physical Breadboard Power Rails (Left) -->
  <rect x="82" y="120" width="20" height="480" rx="3" fill="#ffcdd2" stroke="#e53935" stroke-width="1.2"/>
  <text x="92" y="310" text-anchor="middle" font-size="11" fill="#c62828" font-weight="700" transform="rotate(-90,92,310)">+5V RAIL</text>
  <rect x="112" y="120" width="20" height="480" rx="3" fill="#ffe0b2" stroke="#fb8c00" stroke-width="1.2"/>
  <text x="122" y="310" text-anchor="middle" font-size="11" fill="#e65100" font-weight="700" transform="rotate(-90,122,310)">+3.3V RAIL</text>
  <rect x="142" y="120" width="20" height="480" rx="3" fill="#e0e0e0" stroke="#424242" stroke-width="1.2"/>
  <text x="152" y="310" text-anchor="middle" font-size="11" fill="#111" font-weight="700" transform="rotate(-90,152,310)">GND RAIL</text>

  <!-- Physical Breadboard Power Rails (Right) -->
  <rect x="1148" y="120" width="20" height="480" rx="3" fill="#ffcdd2" stroke="#e53935" stroke-width="1.2"/>
  <text x="1158" y="310" text-anchor="middle" font-size="11" fill="#c62828" font-weight="700" transform="rotate(-90,1158,310)">+5V RAIL</text>
  <rect x="1178" y="120" width="20" height="480" rx="3" fill="#ffe0b2" stroke="#fb8c00" stroke-width="1.2"/>
  <text x="1188" y="310" text-anchor="middle" font-size="11" fill="#e65100" font-weight="700" transform="rotate(-90,1188,310)">+3.3V RAIL</text>
  <rect x="1208" y="120" width="20" height="480" rx="3" fill="#e0e0e0" stroke="#424242" stroke-width="1.2"/>
  <text x="1218" y="310" text-anchor="middle" font-size="11" fill="#111" font-weight="700" transform="rotate(-90,1218,310)">GND RAIL</text>

  <!-- ============================================================ -->
  <!-- COMMON GND — explicit connection between left and right GND rails -->
  <!-- ============================================================ -->
  <line x1="162" y1="100" x2="1148" y2="100" stroke="#424242" stroke-width="3" stroke-dasharray="8,4"/>
  <line x1="162" y1="620" x2="1148" y2="620" stroke="#424242" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="660" y="96" text-anchor="middle" font-size="12" fill="#111" font-weight="700" background="#f0f2f4">Common GND (left and right rails connected)</text>
  <text x="660" y="638" text-anchor="middle" font-size="12" fill="#111" font-weight="700" background="#f0f2f4">Common GND (left and right rails connected)</text>

  <!-- ============================================================ -->
  <!-- 1. ESP32 (Main Controller) -->
  <!-- ============================================================ -->
  <g id="esp32">
    <rect x="410" y="180" width="300" height="180" rx="6" fill="#1a2a3a" stroke="#0b1a2a" stroke-width="2"/>
    <text x="560" y="210" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">ESP32</text>
    <text x="560" y="232" text-anchor="middle" fill="#8cf" font-size="12">Development Board</text>
    
    <!-- Internal Pin Labels -->
    <text x="425" y="270" fill="#8cf" font-size="11" font-weight="600">GPIO 32 (PIR IN)</text>
    <text x="425" y="300" fill="#8cf" font-size="11" font-weight="600">GPIO 34 (LDR IN / ADC)</text>
    
    <text x="680" y="240" fill="#8cf" font-size="11" font-weight="600">5V (PIR VCC)</text>
    <text x="680" y="330" fill="#8cf" font-size="11" font-weight="600">GPIO 15 (LED OUT)</text>
    <text x="680" y="360" fill="#8cf" font-size="11" font-weight="600">GND (Common)</text>
    <text x="680" y="210" fill="#8cf" font-size="11" font-weight="600">3.3V (LDR VCC)</text>

    <!-- Connection Terminals (Left) -->
    <rect x="408" y="265" width="6" height="12" fill="#e0e0e0"/>
    <rect x="408" y="295" width="6" height="12" fill="#e0e0e0"/>
    
    <!-- Connection Terminals (Right) -->
    <rect x="706" y="205" width="6" height="12" fill="#e0e0e0"/>
    <rect x="706" y="235" width="6" height="12" fill="#e0e0e0"/>
    <rect x="706" y="325" width="6" height="12" fill="#e0e0e0"/>
    <rect x="706" y="355" width="6" height="12" fill="#e0e0e0"/>
  </g>

  <!-- ============================================================ -->
  <!-- 2. PIR HC-SR501 -->
  <!-- ============================================================ -->
  <g id="pir">
    <rect x="150" y="380" width="180" height="80" rx="6" fill="#eef4f0" stroke="#2a6b3a" stroke-width="1.8"/>
    <text x="240" y="406" text-anchor="middle" font-size="15" font-weight="700" fill="#1a4a2a">HC-SR501</text>
    <text x="240" y="426" text-anchor="middle" font-size="12" fill="#2a6b3a">PIR Motion Sensor</text>
    <text x="160" y="448" font-size="11" fill="#111">VCC → 5V</text>
    <text x="160" y="462" font-size="11" fill="#111">GND → GND</text>
    <text x="160" y="476" font-size="11" fill="#111">OUT → GPIO 32</text>

    <!-- Connection Terminals -->
    <circle cx="150" cy="400" r="3" fill="#fff" stroke="#e53935" stroke-width="1.5"/>
    <circle cx="150" cy="420" r="3" fill="#fff" stroke="#424242" stroke-width="1.5"/>
    <circle cx="330" cy="435" r="3" fill="#fff" stroke="#1e88e5" stroke-width="1.5"/>
  </g>

  <!-- ============================================================ -->
  <!-- 3. LDR Analog Module -->
  <!-- ============================================================ -->
  <g id="ldr">
    <rect x="150" y="500" width="180" height="70" rx="6" fill="#f5f2e6" stroke="#b38f00" stroke-width="1.8"/>
    <text x="240" y="524" text-anchor="middle" font-size="14" font-weight="700" fill="#664d00">Analog LDR</text>
    <text x="240" y="544" text-anchor="middle" font-size="12" fill="#b38f00">Light Sensor Module</text>
    <text x="160" y="560" font-size="11" fill="#111">VCC → 3.3V</text>
    <text x="160" y="574" font-size="11" fill="#111">GND → GND</text>
    <text x="160" y="588" font-size="11" fill="#111">AO  → GPIO 34 (ADC)</text>

    <!-- Connection Terminals -->
    <circle cx="150" cy="520" r="3" fill="#fff" stroke="#fb8c00" stroke-width="1.5"/>
    <circle cx="150" cy="540" r="3" fill="#fff" stroke="#424242" stroke-width="1.5"/>
    <circle cx="330" cy="550" r="3" fill="#fff" stroke="#1e88e5" stroke-width="1.5"/>
  </g>

  <!-- ============================================================ -->
  <!-- 4. LED Indicator -->
  <!-- ============================================================ -->
  <g id="led">
    <!-- LED -->
    <circle cx="780" cy="450" r="16" fill="#ffeb3b" stroke="#fbc02d" stroke-width="1.5"/>
    <line x1="780" y1="466" x2="780" y2="480" stroke="#111" stroke-width="2"/>
    <text x="780" y="454" text-anchor="middle" font-size="10" fill="#333" font-weight="700">LED</text>

    <!-- 220Ω Resistor -->
    <rect x="720" y="388" width="30" height="14" rx="2" fill="#e6ccb3" stroke="#8b6b4a" stroke-width="1"/>
    <rect x="722" y="390" width="6" height="10" fill="#d32f2f"/>
    <rect x="732" y="390" width="6" height="10" fill="#d32f2f"/>
    <rect x="742" y="390" width="6" height="10" fill="#b71c1c"/>
    <text x="735" y="384" text-anchor="middle" font-size="9" fill="#333" font-weight="700">220Ω</text>

    <!-- Connection Terminals -->
    <circle cx="780" cy="434" r="3" fill="#fff" stroke="#1e88e5" stroke-width="1.5"/>
    <circle cx="780" cy="466" r="3" fill="#fff" stroke="#424242" stroke-width="1.5"/>
    <circle cx="720" cy="395" r="3" fill="#fff" stroke="#1e88e5" stroke-width="1.5"/>
    <circle cx="750" cy="395" r="3" fill="#fff" stroke="#1e88e5" stroke-width="1.5"/>
  </g>

  <!-- ============================================================ -->
  <!-- 5. WIRING & CONNECTIONS -->
  <!-- ============================================================ -->
  <g id="wires">
    <!-- PIR VCC to +5V Rail (Left) -->
    <path d="M 150,400 L 102,400" class="v5"/>
    <text x="126" y="393" font-size="11" fill="#c62828" font-weight="600">5V</text>

    <!-- PIR GND to GND Rail (Left) -->
    <path d="M 150,420 L 142,420" class="gnd"/>
    <text x="146" y="413" font-size="11" fill="#111" font-weight="600">GND</text>

    <!-- PIR OUT to ESP32 GPIO 32 -->
    <path d="M 330,435 L 380,435 L 380,270 L 410,270" class="sig"/>
    <text x="370" y="350" font-size="11" fill="#1e88e5" font-weight="600">GPIO 32</text>

    <!-- LDR VCC to +3.3V Rail (Left) -->
    <path d="M 150,520 L 122,520" class="v33"/>
    <text x="136" y="513" font-size="11" fill="#e65100" font-weight="600">3.3V</text>

    <!-- LDR GND to GND Rail (Left) -->
    <path d="M 150,540 L 142,540" class="gnd"/>
    <text x="146" y="533" font-size="11" fill="#111" font-weight="600">GND</text>

    <!-- LDR AO to ESP32 GPIO 34 (ADC) -->
    <path d="M 330,550 L 380,550 L 380,300 L 410,300" class="sig"/>
    <text x="370" y="425" font-size="11" fill="#1e88e5" font-weight="600">GPIO 34 (ADC)</text>

    <!-- ESP32 3.3V Output to +3.3V Rail (Right) -->
    <path d="M 710,210 L 1178,210" class="v33"/>
    <text x="940" y="203" font-size="11" fill="#e65100" font-weight="600">3.3V (LDR VCC)</text>

    <!-- ESP32 5V Output to +5V Rail (Right) -->
    <path d="M 710,240 L 1148,240" class="v5"/>
    <text x="925" y="233" font-size="11" fill="#c62828" font-weight="600">5V (PIR VCC)</text>

    <!-- ESP32 GND to GND Rail (Right) -->
    <path d="M 710,360 L 1208,360" class="gnd"/>
    <text x="1020" y="353" font-size="11" fill="#111" font-weight="600">ESP32 GND → Common GND</text>

    <!-- LED Cathode to Common GND (Right rail) -->
    <path d="M 780,466 L 780,520 L 1208,520 L 1208,360" class="gnd"/>
    <text x="990" y="545" font-size="11" fill="#111" font-weight="600">LED (−) → Common GND</text>

    <!-- ESP32 GPIO 15 → 220Ω Resistor (input/left terminal) -->
    <path d="M 710,330 L 680,330 L 680,395 L 720,395" class="sig"/>
    <text x="685" y="365" font-size="11" fill="#1e88e5" font-weight="600">GPIO 15</text>

    <!-- 220Ω Resistor (output/right terminal) → LED anode (+) -->
    <path d="M 750,395 L 780,434" class="sig"/>
    <text x="760" y="410" font-size="11" fill="#1e88e5" font-weight="600">220Ω → LED (+)</text>
  </g>

  <!-- ============================================================ -->
  <!-- 6. SYSTEM FLOW DIAGRAM (Right Side) -->
  <!-- ============================================================ -->
  <g id="flow-diagram">
    <rect x="1360" y="140" width="510" height="340" rx="8" fill="#f7f9fc" stroke="#ccc" stroke-width="1.5"/>
    <text x="1615" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#111">System Flow</text>

    <!-- Flow boxes -->
    <rect x="1380" y="190" width="200" height="44" rx="6" fill="#d9e6f2" stroke="#4a7a9c" stroke-width="1.5"/>
    <text x="1480" y="218" text-anchor="middle" font-size="13" font-weight="600" fill="#0b2a4a">HC-SR501 PIR</text>
    <text x="1480" y="232" text-anchor="middle" font-size="11" fill="#1a4a6a">Motion Sensor</text>

    <rect x="1380" y="270" width="200" height="44" rx="6" fill="#f2e6d9" stroke="#b38f00" stroke-width="1.5"/>
    <text x="1480" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#664d00">Analog LDR</text>
    <text x="1480" y="312" text-anchor="middle" font-size="11" fill="#b38f00">Light Sensor</text>

    <rect x="1640" y="190" width="210" height="130" rx="6" fill="#e6f0fa" stroke="#1a4a7a" stroke-width="1.8"/>
    <text x="1745" y="218" text-anchor="middle" font-size="16" font-weight="700" fill="#0b2a4a">ESP32</text>
    <text x="1745" y="238" text-anchor="middle" font-size="12" fill="#1a4a6a">Main Controller</text>
    <text x="1745" y="258" text-anchor="middle" font-size="11" fill="#333">• Activity Score (0–10)</text>
    <text x="1745" y="276" text-anchor="middle" font-size="11" fill="#333">• Energy Saver / Vacation</text>
    <text x="1745" y="294" text-anchor="middle" font-size="11" fill="#333">• Wi-Fi / Telegram</text>
    <text x="1745" y="312" text-anchor="middle" font-size="11" fill="#333">• NVS Settings</text>

    <rect x="1640" y="350" width="210" height="44" rx="6" fill="#fff3e6" stroke="#cc7a00" stroke-width="1.5"/>
    <text x="1745" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#804d00">LED Indicator</text>
    <text x="1745" y="392" text-anchor="middle" font-size="11" fill="#cc7a00">Local visual feedback</text>

    <!-- Flow arrows -->
    <line x1="1580" y1="212" x2="1635" y2="250" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="1595" y="228" font-size="11" fill="#333">GPIO 32</text>
    <line x1="1580" y1="292" x2="1635" y2="260" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="1595" y="280" font-size="11" fill="#333">GPIO 34 (ADC)</text>
    <line x1="1745" y1="320" x2="1745" y2="345" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="1755" y="335" font-size="11" fill="#333">GPIO 15</text>

    <!-- External flow -->
    <rect x="1640" y="420" width="210" height="40" rx="6" fill="#e6f0f0" stroke="#2a6a6a" stroke-width="1.5"/>
    <text x="1745" y="446" text-anchor="middle" font-size="13" font-weight="600" fill="#1a4a4a">Wi‑Fi</text>
    <line x1="1745" y1="394" x2="1745" y2="415" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>

    <rect x="1640" y="480" width="210" height="40" rx="6" fill="#e6f0fa" stroke="#1a4a7a" stroke-width="1.5"/>
    <text x="1745" y="506" text-anchor="middle" font-size="13" font-weight="600" fill="#0b2a4a">Telegram</text>
    <line x1="1745" y1="460" x2="1745" y2="475" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>
  </g>

  <!-- ============================================================ -->
  <!-- 7. PINOUT TABLE -->
  <!-- ============================================================ -->
  <g id="pinout-table">
    <rect x="1360" y="520" width="510" height="200" rx="8" fill="#f7f9fc" stroke="#ccc" stroke-width="1.5"/>
    <text x="1615" y="546" text-anchor="middle" font-size="16" font-weight="700" fill="#111">Pinout Table</text>
    <line x1="1380" y1="558" x2="1850" y2="558" stroke="#aaa" stroke-width="1"/>

    <text x="1400" y="580" font-size="13" font-weight="700" fill="#111">Component</text>
    <text x="1570" y="580" font-size="13" font-weight="700" fill="#111">Pin / Connection</text>

    <line x1="1380" y1="590" x2="1850" y2="590" stroke="#ddd" stroke-width="1"/>

    <text x="1400" y="610" font-size="12" fill="#222">PIR VCC</text>
    <text x="1570" y="610" font-size="12" fill="#222">5V</text>
    <text x="1400" y="630" font-size="12" fill="#222">PIR GND</text>
    <text x="1570" y="630" font-size="12" fill="#222">GND</text>
    <text x="1400" y="650" font-size="12" fill="#222">PIR OUT</text>
    <text x="1570" y="650" font-size="12" fill="#222">GPIO 32</text>
    <text x="1400" y="670" font-size="12" fill="#222">LDR VCC</text>
    <text x="1570" y="670" font-size="12" fill="#222">3.3V</text>
    <text x="1400" y="690" font-size="12" fill="#222">LDR GND</text>
    <text x="1570" y="690" font-size="12" fill="#222">GND</text>
    <text x="1400" y="710" font-size="12" fill="#222">LDR AO</text>
    <text x="1570" y="710" font-size="12" fill="#222">GPIO 34 (ADC)</text>
    <text x="1400" y="730" font-size="12" fill="#222">LED (+)</text>
    <text x="1570" y="730" font-size="12" fill="#222">GPIO 15 → 220Ω → LED (+)</text>
    <text x="1400" y="750" font-size="12" fill="#222">LED (−)</text>
    <text x="1570" y="750" font-size="12" fill="#222">GND</text>
  </g>

  <!-- ============================================================ -->
  <!-- 8. HOW IT WORKS SECTION -->
  <!-- ============================================================ -->
  <g id="how-it-works">
    <rect x="60" y="640" width="1200" height="180" rx="8" fill="#f7f9fc" stroke="#ccc" stroke-width="1.5"/>
    <text x="660" y="668" text-anchor="middle" font-size="16" font-weight="700" fill="#111">How It Works</text>

    <text x="90" y="700" font-size="13" font-weight="700" fill="#1a4a6a">PIR Sensor</text>
    <text x="90" y="720" font-size="12" fill="#333">• Detects human motion / activity</text>
    <text x="90" y="740" font-size="12" fill="#333">• ESP32 processes activity for scoring (0–10)</text>

    <text x="440" y="700" font-size="13" font-weight="700" fill="#b38f00">LDR Light Sensor</text>
    <text x="440" y="720" font-size="12" fill="#333">• Measures ambient light level</text>
    <text x="440" y="740" font-size="12" fill="#333">• ESP32 determines light state (ON/OFF)</text>

    <text x="800" y="700" font-size="13" font-weight="700" fill="#1a4a7a">ESP32</text>
    <text x="800" y="720" font-size="12" fill="#333">• Processes sensor data</text>
    <text x="800" y="740" font-size="12" fill="#333">• Energy Saver / Vacation Security logic</text>
    <text x="800" y="760" font-size="12" fill="#333">• Wi‑Fi connectivity &amp; Telegram communication</text>
    <text x="800" y="780" font-size="12" fill="#333">• NVS stores mode/language</text>

    <text x="1100" y="700" font-size="13" font-weight="700" fill="#cc7a00">LED</text>
    <text x="1100" y="720" font-size="12" fill="#333">• Local visual activity</text>
    <text x="1100" y="740" font-size="12" fill="#333">  indication</text>
  </g>

  <!-- ============================================================ -->
  <!-- 9. FOOTER (Moved upward to fit within 1080px canvas) -->
  <!-- ============================================================ -->
  <text x="960" y="1040" text-anchor="middle" font-size="14" fill="#666">Current hardware prototype — ESP32 + HC-SR501 PIR + Analog LDR + LED</text>
  <text x="960" y="1065" text-anchor="middle" font-size="12" fill="#888">WatchPod v1.2 — For GitHub /docs &amp; project documentation</text>
</svg>
